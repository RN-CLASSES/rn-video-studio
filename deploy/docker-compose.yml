# Run from the deploy/ folder:   docker compose up -d --build
services:
  api:
    build: ../worker
    env_file: .env
    restart: unless-stopped
    volumes:
      - videos:/data
    expose:
      - "8000"            # NOT published: only Caddy can reach it (keeps rate limiting honest)

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  videos:
  caddy_data:
